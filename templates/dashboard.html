<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background:#f3f4f6;
      font-family:'Inter',sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .box {
      background:white;
      padding:40px;
      width:400px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
      text-align:center;
    }
    h2 { margin-bottom:30px; color:#111827; }

    .btn {
      display:block;
      width:100%;
      padding:15px;
      background:#6366f1;
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-size:1.1rem;
      margin:12px 0;
    }

    .btn:hover { background:#4f46e5; }
  </style>
</head>

<body>
  <div class="box">
    <h2>Choose an Option</h2>
    <a href="/expense-page" class="btn">Manage Expenses</a>
    <a href="/income" class="btn">Manage Income</a>
    <a href="/analytics-page" class="btn">View Analytics</a>

  </div>
</body>
</html>
