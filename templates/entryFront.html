<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 30px;
      font-size: 2.2rem;
      color: #111827;
    }
    .container {
      width: 95%;
      max-width: 1000px;
      margin-top: 20px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-input {
      flex-grow: 1;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }
    .form-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .form-container input {
      flex: 1 1 180px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }
    .form-container button {
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    .form-container button:hover {
      background-color: #4f46e5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
    }
    th {
      background-color: #f9fafb;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .edit-btn, .delete-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .edit-btn { background-color: #fbbf24; margin-right: 8px; }
    .edit-btn:hover { background-color: #f59e0b; }
    .delete-btn { background-color: #ef4444; color: white; }
    .delete-btn:hover { background-color: #dc2626; }
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-content h3 { margin: 0; }
    .close-btn { background: #9ca3af; }
    .close-btn:hover { background: #6b7280; }
  </style>
</head>
<body>

  <h1>---💸 Expense Entry---</h1>

  <div class="container">
    <div class="top-bar">
      <input type="text" id="search" class="search-input" placeholder="🔍 Search by description, category or date...">
    </div>

    <div class="form-container">
      <input type="text" id="desc" placeholder="Description">
      <input type="number" id="amount" placeholder="Amount (₹)">
      <input type="text" id="category" placeholder="Category">
      <input type="text" id="notes" placeholder="Notes">
      <input type="date" id="date">
      <button onclick="addExpense()">Add Expense</button>
    </div>

    <table id="expenseTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Notes</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Expense</h3>
      <input type="hidden" id="editId" />
      <input type="text" id="editDesc" placeholder="Description">
      <input type="number" id="editAmount" placeholder="Amount">
      <input type="text" id="editCategory" placeholder="Category">
      <input type="text" id="editNotes" placeholder="Notes">
      <input type="date" id="editDate">
      <button onclick="saveEdit()">Save</button>
      <button class="close-btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
  <div class="container">
  <div class="mb-3">
    <a href="/dashboard" class="btn btn-outline-secondary">← Back to Dashboard</a>
  </div>
  <script>
    const apiBase = "http://127.0.0.1:5000";
    let expenses = [];

    async function fetchExpenses() {
      try {
        const res = await fetch(`${apiBase}/view-expenses`);
        expenses = await res.json();
        displayExpenses(expenses);
      } catch (err) {
        console.error("Error fetching expenses:", err);
      }
    }

    function displayExpenses(data) {
      const tbody = document.querySelector("#expenseTable tbody");
      tbody.innerHTML = "";
      data.forEach(exp => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${exp.id}</td>
          <td>${exp.description}</td>
          <td>₹${exp.amount.toFixed(2)}</td>
          <td>${exp.category}</td>
          <td>${exp.notes || ""}</td>
          <td>${exp.date || "-"}</td>
          <td>
            <button class="edit-btn" onclick="openEditModal(${exp.id})">Edit</button>
            <button class="delete-btn" onclick="deleteExpense(${exp.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function addExpense() {
    const desc = document.getElementById("desc").value.trim();
    const amount = parseFloat(document.getElementById("amount").value);
    let category = document.getElementById("category").value.trim(); // allow blank
    const notes = document.getElementById("notes").value.trim();
    const date = document.getElementById("date").value;

    if (!desc || isNaN(amount) || !date) {
      alert("Please fill Description, Amount, and Date!");
      return;
    }

    // Auto-predict category if not provided
    if (!category) {
      try {
        const res = await fetch(`${apiBase}/predict-category`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ description: desc })
        });
        const result = await res.json();
        category = result.category || "Uncategorized";
      } catch (err) {
        console.error("Prediction failed:", err);
        category = "Uncategorized";
      }
    }

    const expense = { description: desc, amount, category, notes, date };
    try {
      const res = await fetch(`${apiBase}/add-expense`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(expense)
      });
      const result = await res.json();
      alert(result.message || "Expense added.");
      fetchExpenses();
      document.querySelectorAll(".form-container input").forEach(i => i.value = "");
    } catch (err) {
      console.error("Add failed:", err);
    }
  }
document.getElementById("desc").addEventListener("blur", async function () {
  const desc = this.value.trim();
  const categoryInput = document.getElementById("category");

  if (!desc) {
    categoryInput.value = "";
    return;
  }

  try {
    const res = await fetch(`${apiBase}/predict-category`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ description: desc })
    });
    const result = await res.json();
    categoryInput.value = result.category || "";
  } catch (err) {
    console.error("Live prediction failed:", err);
    categoryInput.value = "";
  }
});
    async function deleteExpense(id) {
      if (!confirm("Are you sure you want to delete this expense?")) return;
      try {
        const res = await fetch(`${apiBase}/delete-expense/${id}`, { method: "DELETE" });
        const result = await res.json();
        alert(result.message || result.error);
        fetchExpenses();
      } catch (err) {
        console.error("Delete failed:", err);
      }
    }

       function openEditModal(id) {
      const exp = expenses.find(e => e.id === id);
      if (!exp) return;
      document.getElementById("editId").value = exp.id;
      document.getElementById("editDesc").value = exp.description;
      document.getElementById("editAmount").value = exp.amount;
      document.getElementById("editCategory").value = exp.category;
      document.getElementById("editNotes").value = exp.notes || "";
      document.getElementById("editDate").value = exp.date;
      document.getElementById("editModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
    }

    async function saveEdit() {
      const id = document.getElementById("editId").value;
      const desc = document.getElementById("editDesc").value.trim();
      const amount = parseFloat(document.getElementById("editAmount").value);
      const category = document.getElementById("editCategory").value.trim();
      const notes = document.getElementById("editNotes").value.trim();
      const date = document.getElementById("editDate").value;

      if (!desc || isNaN(amount) || !category || !date) {
        alert("Please fill all fields correctly.");
        return;
      }

      const updatedExpense = { description: desc, amount, category, notes, date };

      try {
        const res = await fetch(`${apiBase}/update-expense/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedExpense)
        });
        const result = await res.json();
        alert(result.message || result.error);
        closeModal();
        fetchExpenses();
      } catch (err) {
        console.error("Update failed:", err);
      }
    }

    // ===== Search Filter =====
    document.getElementById("search").addEventListener("input", function() {
      const q = this.value.toLowerCase();
      const filtered = expenses.filter(e =>
        e.description.toLowerCase().includes(q) ||
        e.category.toLowerCase().includes(q) ||
        (e.date && e.date.toLowerCase().includes(q))
      );
      displayExpenses(filtered);
    });

    // ===== Init =====
    fetchExpenses();
  </script>

</body>
</html>
