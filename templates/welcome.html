<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
        }
        .container {
            width: 95%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h2 {
            text-align: center;
            font-size: 1.8rem;
            color: #111827;
            margin-bottom: 20px;
        }
        .sub-heading {
            font-size: 1.2rem;
            margin-top: 25px;
            margin-bottom: 8px;
            color: #4b5563;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.95rem;
            color: #374151;
            margin-bottom: 5px;
        }
        input {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary {
            background-color: #6366f1;
            color: white;
        }
        .btn-primary:hover {
            background-color: #4f46e5;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            margin-top: 20px;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .flash-messages div {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .flash-success { background: #bbf7d0; color: #166534; }
        .flash-error { background: #fecaca; color: #991b1b; }
    </style>
</head>

<body>
    <div class="container">

        <h2>Welcome, {{ name }} 👋</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <p style="text-align:center; color:#4b5563;">
            You have successfully logged in.
        </p>

        <!-- Update name -->
        <h3 class="sub-heading">Update Your Profile</h3>
        <form action="/update_profile" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" value="{{ name }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Name</button>
        </form>

        <!-- Change Password -->
        <h3 class="sub-heading">Change Password</h3>
        <form action="/change_password" method="POST">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
        <a href="/dashboard" class="btn btn-primary">Continue</a>

        <a href="/logout">
            <button class="btn btn-danger">Logout</button>
        </a>

    </div>
</body>
</html>
