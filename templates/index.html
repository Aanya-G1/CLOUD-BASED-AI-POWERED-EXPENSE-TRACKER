<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>---Welcome to Expense Tracker---</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;}
    body {
      font-family:'Inter',sans-serif;
      background:#f3f4f6;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box {
      background:white;
      padding:40px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
      text-align:center;
      width:350px;
    }
    h2 { margin-bottom:20px; color:#111827; }
    .btn {
      background:#6366f1;
      color:white;
      padding:12px;
      display:block;
      width:100%;
      border-radius:8px;
      margin:10px 0;
      text-decoration:none;
      font-size:1rem;
    }
    .btn:hover { background:#4f46e5; }
  </style>
</head>

<body>
  <div class="box">
    <h2>Expense Tracker</h2>
    <a href="/login-page" class="btn">Login</a>
    <a href="/signup-page" class="btn">Sign Up</a>
  </div>
</body>
</html>
