<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background: #f8f9fa; }
    .card { margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1055; }
    th, td { vertical-align: middle; }
  </style>
</head>
<body>

<div class="toast-container">
  <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-semibold" id="toastMessage">Success!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<div class="container">
  <h2 class="mb-4 text-primary fw-bold">Income Management</h2>

  <!-- Stats Cards -->
  <div class="row mb-4 g-3">
    <div class="col-md-4">
      <div class="card text-center p-4 bg-success text-white">
        <h3 id="totalIncome" class="mb-0">₹0</h3>
        <small>Total Income</small>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center p-4 bg-info text-white">
        <h3 id="recordCount" class="mb-0">0</h3>
        <small>Records</small>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center p-4 bg-warning text-white">
        <h3 id="avgIncome" class="mb-0">₹0</h3>
        <small>Average Income</small>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title mb-3">Income Records</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Source</th>
              <th class="text-end">Amount</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Income Form -->
  <div class="card mt-4">
    <div class="card-body">
      <h5 class="card-title">Add New Income</h5>
      <form id="incomeForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control" required autofocus>
          </div>
          <div class="col-md-6">
            <label class="form-label">Date</label>
            <input type="date" id="date" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Source</label>
            <select id="source" class="form-select" required>
              <option value="">-- Choose --</option>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Investment">Investment</option>
              <option value="Gift">Gift</option>
              <option value="Business">Business</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Amount</label>
            <input type="number" id="amount" class="form-control" step="0.01" min="0" required placeholder="e.g. 5000">
          </div>
          <div class="col-12">
            <label class="form-label">Notes (optional)</label>
            <textarea id="notes" class="form-control" rows="2"></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-lg px-5">Save Income</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="container">
  <div class="mb-3">
    <a href="/dashboard" class="btn btn-outline-secondary">← Back to Dashboard</a>
  </div>

  <h2 class="mb-4 text-primary fw-bold">Income Management</h2>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = "https://jezpksiujzvsifiwtlrp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplenBrc2l1anp2c2lmaXd0bHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyMjczNTQsImV4cCI6MjA3ODU4NzM1NH0.bXX6YcS2fb0DNxI-tO_t9dyZ7qXO1UkDcBKhg2QWzws"; 

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let incomeRecords = [];

  const toastEl = document.getElementById('successToast');
  const toast = new bootstrap.Toast(toastEl);

  function showToast(message) {
    document.getElementById('toastMessage').textContent = message;
    toast.show();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = incomeRecords.length === 0 
      ? `<tr><td colspan="5" class="text-center text-muted py-4">No records yet. Add your first income!</td></tr>`
      : incomeRecords.map(r => `
        <tr>
          <td>${r.date ? new Date(r.date).toLocaleDateString('en-IN') : '-'}</td>
          <td><strong>${r.name}</strong></td>
          <td><span class="badge bg-secondary">${r.source}</span></td>
          <td class="text-end fw-bold text-success">₹${Number(r.amount).toLocaleString('en-IN')}</td>
          <td class="text-muted">${r.notes || '-'}</td>
        </tr>
      `).join('');
  }

  function updateStats() {
    // Safely convert amount to number, skip invalid entries
    const validRecords = incomeRecords.filter(r => r.amount != null && !isNaN(Number(r.amount)));
    const amounts = validRecords.map(r => Number(r.amount));
    const total = amounts.reduce((sum, a) => sum + a, 0);
    const avg = amounts.length > 0 ? total / amounts.length : 0;

    document.getElementById('totalIncome').textContent = `₹${total.toLocaleString('en-IN')}`;
    document.getElementById('recordCount').textContent = validRecords.length;
    document.getElementById('avgIncome').textContent = `₹${avg.toFixed(0).toLocaleString('en-IN')}`;
  }

  async function loadIncome() {
    const { data, error } = await supabase
      .from('income')
      .select('*')
      .order('date', { ascending: false });

    if (error) {
      showToast('Error loading data: ' + error.message);
      console.error(error);
      return;
    }

    incomeRecords = data || [];
    renderTable();
    updateStats();
  }

  // Form Submit
  document.getElementById('incomeForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const date = document.getElementById('date').value;
    const source = document.getElementById('source').value;
    const amountRaw = document.getElementById('amount').value;
    const notes = document.getElementById('notes').value.trim();

    // Critical: Force amount as proper number
    const amount = parseFloat(amountRaw);
    if (isNaN(amount) || amount <= 0) {
      alert('Please enter a valid amount');
      return;
    }

    const { error } = await supabase
      .from('income')
      .insert({ name, date, source, amount, notes });

    if (error) {
      showToast('Failed to save: ' + error.message);
      console.error(error);
      return;
    }

    showToast('Income saved successfully!');
    e.target.reset();
    document.getElementById('name').focus();
    await loadIncome();
  });

  // Set today as default date
  document.getElementById('date').valueAsDate = new Date();

  // Load data on start
  document.addEventListener('DOMContentLoaded', loadIncome);
</script>
</body>
</html>
